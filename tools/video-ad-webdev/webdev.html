<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Web Graphs — Web &amp; app development ad</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --navy:#001523; --ink:#f2f6f8; --mute:#9fb3c1; --red:#ff4545; --green:#22c55e; --wa:#25d366; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1080px; height:1920px; overflow:hidden; background:var(--navy); }
body { font-family:'Google Sans', system-ui, sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--navy); }
.a { position:absolute; left:0; top:0; will-change:transform, opacity; transform-origin:50% 50%; }
/* brand shapes that drift behind the glass */
.shape { border-radius:50%; }
/* frosted glass */
.glass { background:rgba(255,255,255,.075); -webkit-backdrop-filter:blur(30px) saturate(1.5); backdrop-filter:blur(30px) saturate(1.5);
  border:1.5px solid rgba(255,255,255,.17); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22), 0 50px 90px -50px rgba(0,0,0,.75); }
.glass-2 { background:rgba(255,255,255,.12); -webkit-backdrop-filter:blur(22px) saturate(1.4); backdrop-filter:blur(22px) saturate(1.4);
  border:1.5px solid rgba(255,255,255,.2); box-shadow:inset 0 1.5px 0 rgba(255,255,255,.25), 0 30px 60px -30px rgba(0,0,0,.7); }
.line { position:absolute; left:80px; overflow:hidden; padding-bottom:.12em; white-space:nowrap; }
.w { display:inline-block; will-change:transform; }
.h-l { font-size:112px; font-weight:500; letter-spacing:-.04em; line-height:1.02; }
.red { color:var(--red); }
.chip { display:inline-flex; align-items:center; gap:14px; height:62px; padding:0 26px; border-radius:99px; font-size:28px; font-weight:500; white-space:nowrap; }
.chip i { width:12px; height:12px; border-radius:50%; background:var(--red); }
.row { display:flex; align-items:center; gap:18px; }
.bar { display:block; border-radius:8px; background:rgba(255,255,255,.85); }
.bar.dim { background:rgba(255,255,255,.28); }
.tick { width:42px; height:42px; border-radius:50%; background:var(--green); display:grid; place-items:center; flex:none; }
.tick svg { width:24px; height:24px; }
.mono { font-variant-numeric:tabular-nums; }
.layer { position:absolute; left:0; top:0; }
</style></head>
<body><div id="stage"></div>
<script>
/* =====================================================================
   Deterministic animation engine: every property is a pure function of
   time, so render(t) gives the same frame every time (60 fps capture).
   Adds w / h / rad tweens so one glass panel can morph between shapes.
   ===================================================================== */
const A = '../../assets/';
const stage = document.getElementById('stage');
const ELS = [];
const P = (n) => n + 'px';
function mk(cls, html = '', css = {}, parent = stage) {
  const e = document.createElement('div');
  e.className = 'a ' + cls; e.innerHTML = html; Object.assign(e.style, css);
  parent.appendChild(e); e._t = []; ELS.push(e); return e;
}
function bez(x1, y1, x2, y2) {
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x;
      const dx = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t;
      if (Math.abs(cx) < 1e-6) break; t -= cx / (dx || 1e-6); t = Math.min(1, Math.max(0, t));
    }
    return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3;
  };
}
const EASE = { out: bez(.16, 1, .3, 1), io: bez(.65, 0, .35, 1), morph: bez(.7, 0, .2, 1), in: bez(.55, 0, .9, .4), lin: (x) => x };
function springAt(s, k = 1) {
  const w = 15 * k, z = .6, wd = w * Math.sqrt(1 - z * z);
  if (s <= 0) return 0;
  return 1 - Math.exp(-z * w * s) * (Math.cos(wd * s) + (z * w / wd) * Math.sin(wd * s));
}
function tw(e, prop, t0, dur, from, to, ease = 'out', k = 1) { e._t.push({ prop, t0, dur, from, to, ease, k }); return e; }
const lerp = (a, b, p) => Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * p) : a + (b - a) * p;
function val(e, prop, t, def) {
  const ts = e._t.filter((x) => x.prop === prop);
  if (!ts.length) return def;
  if (t < ts[0].t0) return ts[0].from;
  let cur = ts[0];
  for (const x of ts) if (x.t0 <= t) cur = x;
  const s = t - cur.t0;
  let p = cur.ease === 'spring' ? springAt(s, cur.k) : (cur.dur ? EASE[cur.ease](Math.min(1, s / cur.dur)) : 1);
  if (cur.ease !== 'spring' && s >= cur.dur) p = 1;
  return lerp(cur.from, cur.to, p);
}
function render(t) {
  for (const e of ELS) {
    const x = val(e, 'x', t, 0), y = val(e, 'y', t, 0), s = val(e, 's', t, 1), r = val(e, 'r', t, 0), sx = val(e, 'sx', t, 1), o = val(e, 'o', t, 1);
    e.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) rotate(${r.toFixed(3)}deg) scale(${(s * sx).toFixed(4)}, ${s.toFixed(4)})`;
    e.style.opacity = Math.max(0, Math.min(1, o)).toFixed(3);
    const w = val(e, 'w', t, null), h = val(e, 'h', t, null), rad = val(e, 'rad', t, null);
    if (w !== null) e.style.width = w.toFixed(2) + 'px';
    if (h !== null) e.style.height = h.toFixed(2) + 'px';
    if (rad !== null) e.style.borderRadius = rad.toFixed(2) + 'px';
    const c = val(e, 'clip', t, null);
    if (c) e.style.clipPath = `inset(${c[0].toFixed(2)}% ${c[1].toFixed(2)}% ${c[2].toFixed(2)}% ${c[3].toFixed(2)}% round ${(c[4] || 0).toFixed(1)}px)`;
    if (e._fn) e._fn(t);
  }
}
window.render = render;

/* ---------- helpers ---------- */
const W = (t, c) => ({ t, c });
function words(lines, top, cls, t0, gap = 0.07, lineH = 1.06) {
  const out = []; let n = 0;
  lines.forEach((ln, li) => {
    const L = document.createElement('div'); L.className = 'line ' + cls; stage.appendChild(L);
    const fs = parseFloat(getComputedStyle(L).fontSize); L.style.top = P(top + li * fs * lineH);
    ln.forEach((wd, wi) => {
      const w = mk('w' + (wd.c ? ' ' + wd.c : ''), (wi ? '&nbsp;' : '') + wd.t, { position: 'relative' }, L);
      tw(w, 'y', t0 + n * gap, 0.9, fs * 1.2, 0, 'out'); w._fs = fs; n++; out.push(w);
    });
  });
  return out;
}
const LEAD = 0.5;
function wordsExit(ws, t0) { ws.forEach((w, i) => tw(w, 'y', t0 + i * 0.022, 0.36, 0, -w._fs * 1.2, 'in')); }
function exit(list, t0, dy = -70, gap = 0.012) {
  list.forEach((e, i) => { const y0 = val(e, 'y', 1e9, 0); tw(e, 'y', t0 + i * gap, 0.42, y0, y0 + dy, 'in'); tw(e, 'o', t0 + i * gap + 0.08, 0.3, 1, 0, 'lin'); });
}
function fadeOut(list, t0, d = 0.3) { list.forEach((e) => tw(e, 'o', t0, d, 1, 0, 'lin')); }
function pop(e, t0, k = 1, from = 0.6) { tw(e, 's', t0, 1, from, 1, 'spring', k); tw(e, 'o', t0, 0.18, 0, 1, 'lin'); return e; }
function rise(e, t0, dy = 60, k = 0.85) { tw(e, 'y', t0, 1, dy, 0, 'spring', k); tw(e, 'o', t0, 0.25, 0, 1, 'lin'); return e; }
function fadeIn(e, t0, d = 0.35) { tw(e, 'o', t0, d, 0, 1, 'lin'); return e; }
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const ICON = (d, size = 30, col = '#fff', sw = 1.9) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const WA_PATH = 'M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.41-.08-.13-.27-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.89 9.88M20.46 3.49A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.16-3.48-8.41Z';
const WA = (s, col = '#fff') => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="${col}"><path d="${WA_PATH}"/></svg>`;
const chip = (txt, t0) => rise(mk('chip glass-2', `<i></i>${txt}`, { left: P(80), top: P(300) }), t0, 40);

/* =====================================================================
   CUES (seconds). Re-timed to the voiceover once the MP3 arrives.
   ===================================================================== */
const C = window.CUES || {
  s1: 0, s1b: 2.0, s2: 3.9, fast: 7.6, mobile: 8.6, brand: 9.8,
  s3: 11.4, grow: 15.6, rowBiz: 16.4, rowBook: 17.8, rowStore: 19.4,
  s4: 22.6, wa: 24.4, maps: 25.4, seo: 26.4, tap: 29.0,
  s5: 31.0, soon: 34.4, end: 36.6, endWa: 38.4, total: 41.0,
};
const END = C.total;

/* ---------- background: a faint grid and slow brand shapes (seen softened through the glass) ---------- */
const grid = mk('', '', { left: P(-60), top: P(-60), width: P(1200), height: P(2040), opacity: '.45',
  backgroundImage: 'radial-gradient(circle, rgba(159,179,193,.16) 1.6px, transparent 2px)', backgroundSize: '60px 60px' });
tw(grid, 'y', 0, END, 0, -60, 'lin');
const red = mk('shape', '', { left: P(560), top: P(560), width: P(560), height: P(560), background: '#ff4545' });
tw(red, 'x', 0, END, 0, -260, 'io'); tw(red, 'y', 0, END, 0, 420, 'io'); tw(red, 's', 0, END, 1, 0.82, 'io');
const mist = mk('shape', '', { left: P(-140), top: P(1050), width: P(460), height: P(460), background: '#e2e9ed', opacity: '.42' });
tw(mist, 'x', 0, END, 0, 260, 'io'); tw(mist, 'y', 0, END, 0, -380, 'io');
const sq = mk('', '', { left: P(700), top: P(1300), width: P(300), height: P(300), borderRadius: '70px', background: '#2a5b7d' });
tw(sq, 'r', 0, END, 12, -30, 'io'); tw(sq, 'x', 0, END, 0, -420, 'io'); tw(sq, 'y', 0, END, 0, -520, 'io');
// navy wash so the shapes stay quiet outside the glass
mk('', '', { left: 0, top: 0, width: P(1080), height: P(1920), background: 'rgba(0,21,35,.7)' });

const logoTop = mk('', `<img src="${A}logo-footer.svg" style="width:290px;display:block">`, { left: P(72), top: P(150) });
fadeIn(logoTop, 0.1, 0.5); tw(logoTop, 'o', C.end - 0.2, 0.3, 1, 0, 'lin');

/* =====================================================================
   THE MORPHING GLASS PANEL — one element that changes shape scene to scene
   ===================================================================== */
const M = mk('glass', '', { overflow: 'hidden' });
const SHAPES = {
  post:    { x: 290, y: 640, w: 500, h: 660, rad: 44 },
  browser: { x: 80, y: 640, w: 920, h: 600, rad: 34 },
  row:     { x: 80, y: 650, w: 920, h: 176, rad: 30 },
  phone:   { x: 300, y: 600, w: 480, h: 940, rad: 70 },
  dash:    { x: 80, y: 640, w: 920, h: 720, rad: 34 },
  end:     { x: 110, y: 560, w: 860, h: 860, rad: 48 },
};
function morph(t0, from, to, dur = 0.95) {
  const a = SHAPES[from], b = SHAPES[to];
  ['x', 'y', 'w', 'h', 'rad'].forEach((k) => tw(M, k, t0, dur, a[k], b[k], 'morph'));
}
// first appearance as the social post
['x', 'y', 'w', 'h', 'rad'].forEach((k) => tw(M, k, 0, 0, SHAPES.post[k], SHAPES.post[k], 'lin'));
tw(M, 's', 0.35, 1, 0.82, 1, 'spring', .8); tw(M, 'o', 0.35, 0.3, 0, 1, 'lin');
morph(C.s2 - 0.1, 'post', 'browser');
morph(C.s3 - 0.1, 'browser', 'row');
morph(C.s4 - 0.1, 'row', 'phone');
morph(C.s5 - 0.1, 'phone', 'dash');
morph(C.end - 0.1, 'dash', 'end', 1.05);
// layers live inside the panel; each fades in once its shape has settled
const layer = (html, w, h) => mk('layer', html, { width: P(w), height: P(h) }, M);

/* ===================== 1. MORE THAN A SOCIAL PAGE ===================== */
{
  const t = C.s1;
  const c = chip('Web &amp; app development', t + 0.2);
  const h = words([[W('More'), W('than'), W('a')], [W('social'), W('page.', 'red')]], 390, 'h-l', t + 0.3, 0.08);
  const post = layer(`<div style="padding:30px">
      <div class="row" style="gap:16px"><i style="width:64px;height:64px;border-radius:50%;background:#ff4545"></i><div><i class="bar" style="width:190px;height:16px"></i><i class="bar dim" style="width:120px;height:12px;margin-top:10px"></i></div></div>
      <div style="height:330px;border-radius:26px;margin-top:26px;background:rgba(255,255,255,.14);display:grid;place-items:center">${ICON('<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>', 88, 'rgba(255,255,255,.55)', 1.4)}</div>
      <div class="row" style="gap:24px;margin-top:26px;font-size:30px;color:rgba(255,255,255,.75)"><span>♥ 24</span><span>💬 3</span></div>
      <i class="bar dim" style="width:80%;height:14px;margin-top:20px"></i></div>`, 500, 660);
  fadeIn(post, t + 0.55, 0.35); tw(post, 'o', C.s2 - 0.25, 0.2, 1, 0, 'lin');
  // "is that enough?" — a small glass note leans in
  const note = mk('chip glass-2', `<span style="font-size:30px">🤔</span>Only on social media?`, { left: P(250), top: P(1360) });
  rise(note, C.s1b, 40);
  wordsExit(h, C.s2 - LEAD); exit([c, note], C.s2 - LEAD);
}

/* ===================== 2. WEBSITES THAT BRING CUSTOMERS ===================== */
{
  const t = C.s2;
  const c = chip('Web Graphs · Websites', t + 0.1);
  const h = words([[W('Websites'), W('that')], [W('bring'), W('customers.', 'red')]], 390, 'h-l', t + 0.15, 0.08);
  const L = layer('', 920, 600);
  // browser chrome + url typing
  const chrome = mk('', `<div class="row" style="height:84px;padding:0 28px;gap:12px;border-bottom:1.5px solid rgba(255,255,255,.12)">
      <i style="width:16px;height:16px;border-radius:50%;background:#ff5f57"></i><i style="width:16px;height:16px;border-radius:50%;background:#febc2e"></i><i style="width:16px;height:16px;border-radius:50%;background:#28c840"></i>
      <div class="row" style="margin-left:22px;height:48px;flex:1;border-radius:99px;background:rgba(255,255,255,.1);padding:0 22px;gap:12px;font-size:25px;color:rgba(255,255,255,.85)">${ICON('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', 22, 'rgba(255,255,255,.7)', 2)}<span class="url"></span></div></div>`, {}, L);
  fadeIn(chrome, t + 0.7);
  const url = chrome.querySelector('.url'); const U = 'yourbusiness.co.za';
  chrome._fn = (tt) => { const n = Math.max(0, Math.min(U.length, Math.floor((tt - (t + 0.9)) / 0.045))); url.textContent = U.slice(0, n); };
  // site content builds
  const nav = mk('', `<div class="row" style="justify-content:space-between;width:864px"><div class="row" style="gap:12px"><i style="width:40px;height:40px;border-radius:12px;background:#ff4545"></i><i class="bar" style="width:150px;height:18px"></i></div><div class="row" style="gap:26px">${[70, 80, 64].map((w) => `<i class="bar dim" style="width:${w}px;height:12px"></i>`).join('')}<span style="height:46px;padding:0 22px;border-radius:99px;background:#fff;color:#001523;font-size:20px;font-weight:600;display:grid;place-items:center">Book now</span></div></div>`, { left: P(28), top: P(108) }, L);
  rise(nav, t + 1.5, -24);
  const hero = mk('', `<img src="${A}photos/coding-web-dev-1200.jpg" style="width:100%;height:100%;object-fit:cover;display:block">`, { left: P(500), top: P(196), width: P(392), height: P(300), borderRadius: '24px', overflow: 'hidden' }, L);
  tw(hero, 'clip', t + 1.8, 1, [100, 0, 0, 0, 24], [0, 0, 0, 0, 24], 'out');
  const head = [[400, 34], [330, 34], [370, 14], [300, 14]].map(([w, hh], i) => {
    const b = mk('', `<i class="bar${i > 1 ? ' dim' : ''}" style="width:${w}px;height:${hh}px"></i>`, { left: P(28), top: P(210 + [0, 50, 122, 150][i]), transformOrigin: '0 50%' }, L);
    tw(b, 'sx', t + 1.9 + i * 0.09, 0.8, 0, 1, 'out'); return b;
  });
  const cta = mk('', `<span style="height:66px;padding:0 34px;border-radius:99px;background:#ff4545;color:#fff;font-size:24px;font-weight:600;display:grid;place-items:center">Get a quote</span>`, { left: P(28), top: P(412) }, L);
  pop(cta, t + 2.4, 1.1, 0.5);
  // the three promises as floating glass chips, each on its word
  const fast = mk('glass-2', `<div class="row" style="padding:18px 26px 18px 18px;gap:16px"><div style="position:relative;width:76px;height:76px"><svg viewBox="0 0 36 36" width="76" height="76" style="transform:rotate(-90deg)"><circle cx="18" cy="18" r="15.5" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="3.5"/><circle class="arc" cx="18" cy="18" r="15.5" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg><b class="mono" style="position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:600">98</b></div><div><b style="font-size:30px;font-weight:500">Fast</b><div style="font-size:22px;color:#9fb3c1">Loads in a blink</div></div></div>`, { left: P(360), top: P(1272), borderRadius: '30px' });
  rise(fast, C.fast, 50);
  const arc = fast.querySelector('.arc'); fast._fn = (tt) => { const p = EASE.out(Math.min(1, Math.max(0, (tt - C.fast - 0.2) / 1.1))); arc.setAttribute('stroke-dashoffset', (100 - 98 * p).toFixed(2)); };
  const phone = mk('glass-2', `<div style="padding:16px"><div style="height:250px;border-radius:22px;overflow:hidden"><img src="${A}photos/coding-web-dev-800.jpg" style="width:100%;height:100%;object-fit:cover;display:block"></div><i class="bar" style="width:80%;height:14px;margin-top:16px"></i><i class="bar dim" style="width:60%;height:10px;margin-top:10px"></i><span style="display:block;margin-top:16px;height:44px;border-radius:99px;background:#ff4545"></span></div>`, { left: P(80), top: P(1150), width: P(230), height: P(430), borderRadius: '40px' });
  tw(phone, 'y', C.mobile, 1, 120, 0, 'spring', .8); tw(phone, 'o', C.mobile, 0.25, 0, 1, 'lin'); tw(phone, 'r', C.mobile, 1, -10, -4, 'spring', .8);
  const mobLbl = mk('chip glass-2', `${ICON('<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>', 28)}Mobile-friendly`, { left: P(360), top: P(1400) });
  rise(mobLbl, C.mobile + 0.15, 40);
  const brand = mk('glass-2', `<div class="row" style="padding:16px 24px;gap:12px">${['#ff4545', '#001523', '#e2e9ed', '#ffffff'].map((col) => `<i style="width:46px;height:46px;border-radius:50%;background:${col};border:2px solid rgba(255,255,255,.35)"></i>`).join('')}<b style="font-size:28px;font-weight:500;margin-left:6px">Your brand</b></div>`, { left: P(360), top: P(1480), borderRadius: '99px' });
  rise(brand, C.brand, 50);
  fadeOut([L], C.s3 - 0.3, 0.25);
  wordsExit(h, C.s3 - LEAD); exit([c, fast, phone, mobLbl, brand], C.s3 - LEAD);
}

/* ===================== 3. PACKAGES THAT GROW ===================== */
{
  const t = C.s3;
  const c = chip('Website packages', t + 0.1);
  const h = words([[W('Start'), W('small.')], [W('Grow'), W('big.', 'red')]], 390, 'h-l', t + 0.15, 0.08);
  const ICONS = {
