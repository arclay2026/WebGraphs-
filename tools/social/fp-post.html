<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Web Graphs — Uber &amp; Bolt fingerprint post (1080×1350)</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --navy:#001523; --navy2:#0b2537; --line:#1f415a; --red:#ff4545; --ink:#001523; --mute:#55646e; --mist:#f2f5f7; --green:#25d366; --sub:#9fb3c1; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1080px; height:1350px; }
body { font-family:'Google Sans', system-ui, sans-serif; background:var(--navy); color:#fff; overflow:hidden; }
.page { position:relative; width:1080px; height:1350px; overflow:hidden; background:var(--navy); }
.dots { position:absolute; inset:0; opacity:.5; background-image:radial-gradient(circle, rgba(159,179,193,.22) 1.6px, transparent 2px); background-size:30px 30px; }
.disc { position:absolute; border-radius:50%; background:var(--red); }
.wrap { position:absolute; inset:60px 64px 64px; display:flex; flex-direction:column; }
.wrap > * { flex-shrink:0; }
.row { display:flex; align-items:center; }
.ic svg { width:100%; height:100%; display:block; }
.open { gap:10px; height:46px; padding:0 20px; border-radius:99px; font-size:19px; font-weight:500; background:rgba(0,21,35,.6); border:1.5px solid rgba(255,255,255,.3); }
.open i { width:11px; height:11px; border-radius:50%; background:#22c55e; }
.chip { display:inline-flex; align-items:center; gap:10px; height:46px; padding:0 20px; border-radius:99px; font-size:19px; font-weight:500; background:rgba(255,255,255,.08); border:1.5px solid var(--line); }
.chip i { width:10px; height:10px; border-radius:50%; background:var(--red); }
.h1 { font-size:104px; font-weight:600; letter-spacing:-.048em; line-height:.95; }
.h1 em { font-style:normal; color:var(--red); }
.price { font-size:168px; font-weight:600; letter-spacing:-.055em; line-height:.82; color:var(--red); font-variant-numeric:tabular-nums; }
.tick { width:32px; height:32px; border-radius:50%; background:#22c55e; display:grid; place-items:center; flex:none; }
.tick svg { width:19px; height:19px; }
.photo { border-radius:40px; overflow:hidden; border:2px solid rgba(255,255,255,.18); }
.photo img { display:block; width:100%; height:100%; }
</style></head>
<body>
<div class="page">
  <div class="dots"></div>
  <div class="disc" style="width:760px;height:760px;right:-330px;top:-250px"></div>
  <div class="wrap" id="wrap"></div>
</div>
<script>
const A = '../../assets/';
const I = (d, col, sw = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const WA = (col) => `<svg viewBox="0 0 24 24" fill="${col}"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.41-.08-.13-.27-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.89 9.88M20.46 3.49A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.16-3.48-8.41Z"/></svg>`;
const ICONS = {
  id: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.3 1.7-2 3-2s2.4.7 3 2M14 10h4M14 13h3"/>',
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v12h13V9"/><path d="M10 21v-6h4v6"/>',
  card: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 10h6M7 14h10"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
};
const PW = 420, PH = Math.round(PW * 2485 / 1700);   // photo keeps its own ratio, never cropped
document.getElementById('wrap').innerHTML = `
  <div class="row" style="justify-content:space-between">
    <img src="${A}logo-footer.svg" style="height:66px;display:block">
    <span class="row open"><i></i>Open every day · 8:00–19:00</span>
  </div>

  <div style="display:grid;grid-template-columns:minmax(0,1fr) ${PW}px;gap:36px;align-items:center;margin-top:54px">
    <div>
      <span class="chip"><i></i>For Uber &amp; Bolt drivers</span>
      <div class="h1" style="margin-top:26px">Fingerprint<br><em>capture.</em></div>
      <div class="row" style="gap:24px;margin-top:34px">
        <img src="uber-white.svg" style="height:34px;display:block">
        <i style="width:2px;height:40px;background:rgba(255,255,255,.3)"></i>
        <img src="${A}partners/bolt.svg" style="height:44px;display:block">
      </div>
      <div class="row" style="align-items:flex-end;gap:16px;margin-top:46px">
        <div class="price">R350</div>
        <div style="font-size:24px;color:var(--sub);line-height:1.2;margin-bottom:6px">per<br>capture</div>
      </div>
      <div style="font-size:22px;line-height:1.4;color:#dfe7ec;margin-top:30px;max-width:470px">Walk in with your documents and we’ll guide you through the whole process.</div>
    </div>
    <div class="photo" style="width:${PW}px;height:${PH}px;position:relative"><img src="fingerprint-capture.jpg"></div>
  </div>

  <div class="row" style="justify-content:space-between;margin-top:48px;font-size:24px;font-weight:500">
    ${['Walk in — no appointment', 'Done while you wait', 'No long queues'].map((s) => `<div class="row" style="gap:12px"><span class="tick">${TICK}</span>${s}</div>`).join('')}
  </div>

  <div style="margin-top:36px;border-radius:24px;background:rgba(255,255,255,.06);border:1.5px solid var(--line);padding:24px 26px;display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:20px;align-items:center">
    <b style="font-size:21px;font-weight:600;line-height:1.15">What to<br>bring</b>
    ${[['id', 'SA ID or passport', 'The original'], ['home', 'Proof of residence', 'Not older than 3 months'], ['card', 'Licence or PrDP', 'Optional']].map(([ic, n, s]) => `<div class="row" style="gap:12px"><span style="width:46px;height:46px;border-radius:13px;background:rgba(255,69,69,.18);display:grid;place-items:center;flex:none"><span class="ic" style="width:26px;height:26px;display:block">${I(ICONS[ic], '#ff6b6b')}</span></span><div style="line-height:1.2"><div style="font-size:18px;font-weight:600">${n}</div><div style="font-size:15.5px;color:var(--sub)">${s}</div></div></div>`).join('')}
  </div>

  <div style="margin-top:auto;border-radius:30px;background:#fff;color:var(--ink);padding:26px 30px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center">
    <div>
      <div class="row" style="gap:16px"><span style="width:62px;height:62px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none"><span style="width:36px;height:36px;display:block">${WA('#fff')}</span></span><div><div style="font-size:18px;color:var(--mute)">WhatsApp &amp; calls</div><b style="font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums">+27 78 734 7867</b></div></div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:18px;font-size:19px;color:#2a3b47">
        ${[['pin', '9 Jill Street, Langlaagte North, Johannesburg'], ['mail', 'webgraphstechnologies@gmail.com']].map(([ic, s]) => `<div class="row" style="gap:10px"><span class="ic" style="width:24px;height:24px;display:block">${I(ICONS[ic], '#ff4545', 2)}</span>${s}</div>`).join('')}
      </div>
    </div>
    <div style="text-align:right">
      <div style="font-size:17px;color:var(--mute);margin-bottom:10px">More info &amp; driver checker</div>
      <span style="display:inline-flex;align-items:center;gap:10px;height:62px;padding:0 28px;border-radius:99px;background:var(--red);color:#fff;font-size:24px;font-weight:600"><span class="ic" style="width:24px;height:24px;display:block">${I(ICONS.globe, '#fff', 2)}</span>webgraphs.co.za</span>
    </div>
  </div>`;
window.__ready = Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.decode().catch(() => {}))]);
</script>
</body></html>
