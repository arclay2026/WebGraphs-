<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Web Graphs — vertical ad</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --navy:#001523; --navy2:#0a2234; --line:#1b3a50; --ink:#f2f6f8; --mute:#9fb3c1; --red:#ff4545; --green:#22c55e; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1080px; height:1920px; overflow:hidden; background:var(--navy); }
body { font-family:'Google Sans', system-ui, sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--navy); }
.a { position:absolute; will-change:transform, opacity; transform-origin:50% 50%; }
/* faint dot grid that drifts slowly for depth */
#grid { left:-60px; top:-60px; width:1200px; height:2040px; opacity:.5;
  background-image:radial-gradient(circle, rgba(159,179,193,.16) 1.6px, transparent 2px); background-size:60px 60px; }
.logo-top { left:72px; top:150px; width:300px; }
/* type */
.line { position:absolute; left:80px; overflow:hidden; padding-bottom:.12em; white-space:nowrap; }
.w { display:inline-block; will-change:transform; }
.h-xl { font-size:156px; font-weight:500; letter-spacing:-.045em; line-height:1.02; }
.h-l { font-size:118px; font-weight:500; letter-spacing:-.04em; line-height:1.02; }
.red { color:var(--red); }
.chip { display:inline-flex; align-items:center; gap:14px; height:62px; padding:0 26px; border-radius:99px;
  background:rgba(255,255,255,.06); border:1.5px solid var(--line); font-size:28px; font-weight:500; color:var(--ink); white-space:nowrap; }
.chip i { width:12px; height:12px; border-radius:50%; background:var(--red); }
.card { border-radius:34px; background:#0b2537; border:1.5px solid #1f415a; box-shadow:0 40px 80px -40px rgba(0,0,0,.7); }
.card.white { background:#fff; border-color:#fff; color:#001523; }
.photo { overflow:hidden; border-radius:40px; background:#0a2234; }
.photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; will-change:transform; }
.tick { width:44px; height:44px; border-radius:50%; background:var(--green); display:grid; place-items:center; }
.tick svg { width:24px; height:24px; }
.row { display:flex; align-items:center; gap:20px; }
.small { font-size:26px; color:var(--mute); }
.pill { display:inline-flex; align-items:center; gap:14px; padding:0 28px; height:76px; border-radius:99px; font-size:32px; font-weight:500; white-space:nowrap; }
.app { width:150px; height:150px; border-radius:36px; background:#fff; display:grid; place-items:center; box-shadow:0 30px 60px -30px rgba(0,0,0,.6); }
.app img { width:120px; height:120px; }
.mono { font-variant-numeric:tabular-nums; }
</style></head>
<body><div id="stage"><div id="grid" class="a"></div></div>
<script>
/* =====================================================================
   Tiny deterministic animation engine. Every property of every element
   is a pure function of time, so render(t) can be called for any frame
   (60 fps capture) and always gives the same picture.
   ===================================================================== */
const A = '../../assets/';
const stage = document.getElementById('stage');
const ELS = [];
function mk(cls, html = '', css = {}, parent = stage) {
  const e = document.createElement('div');
  e.className = 'a ' + cls; e.innerHTML = html;
  Object.assign(e.style, css);
  parent.appendChild(e);
  e._t = []; ELS.push(e);
  return e;
}
const P = (n) => n + 'px';
// cubic-bezier solver
function bez(x1, y1, x2, y2) {
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x;
      const dx = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t;
      if (Math.abs(cx) < 1e-6) break; t -= cx / (dx || 1e-6); t = Math.min(1, Math.max(0, t));
    }
    return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3;
  };
}
const EASE = {
  out: bez(.16, 1, .3, 1),          // the site's signature ease
  io: bez(.65, 0, .35, 1),
  in: bez(.55, 0, .9, .4),
  lin: (x) => x,
};
// damped spring, time-based (seconds since start) → 0..1 with natural overshoot
function springAt(s, k = 1) {
  const w = 15 * k, z = .58, wd = w * Math.sqrt(1 - z * z);
  if (s <= 0) return 0;
  return 1 - Math.exp(-z * w * s) * (Math.cos(wd * s) + (z * w / wd) * Math.sin(wd * s));
}
// tween: el, prop, start, duration, from, to, ease ('spring' uses springAt)
function tw(e, prop, t0, dur, from, to, ease = 'out', k = 1) { e._t.push({ prop, t0, dur, from, to, ease, k }); return e; }
const lerp = (a, b, p) => Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * p) : a + (b - a) * p;
function val(e, prop, t, def) {
  const ts = e._t.filter((x) => x.prop === prop);
  if (!ts.length) return def;
  if (t < ts[0].t0) return ts[0].from;
  let cur = ts[0];
  for (const x of ts) if (x.t0 <= t) cur = x;
  const s = t - cur.t0;
  let p;
  if (cur.ease === 'spring') p = springAt(s, cur.k);
  else p = cur.dur ? EASE[cur.ease](Math.min(1, s / cur.dur)) : 1;
  if (cur.ease !== 'spring' && s >= cur.dur) p = 1;
  return lerp(cur.from, cur.to, p);
}
function render(t) {
  for (const e of ELS) {
    const x = val(e, 'x', t, 0), y = val(e, 'y', t, 0), s = val(e, 's', t, 1), r = val(e, 'r', t, 0);
    const sx = val(e, 'sx', t, 1), o = val(e, 'o', t, 1);
    e.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) rotate(${r.toFixed(3)}deg) scale(${(s * sx).toFixed(4)}, ${s.toFixed(4)})`;
    e.style.opacity = Math.max(0, Math.min(1, o)).toFixed(3);
    const c = val(e, 'clip', t, null);
    if (c) e.style.clipPath = `inset(${c[0].toFixed(2)}% ${c[1].toFixed(2)}% ${c[2].toFixed(2)}% ${c[3].toFixed(2)}% round ${(c[4] || 0).toFixed(1)}px)`;
    if (e._fn) e._fn(t);
  }
}
window.render = render;

/* ---------- helpers ---------- */
// words that rise out of a mask; returns the word elements
function words(lines, top, cls, t0, gap = 0.07, lineH = 1.06) {
  const out = [];
  let n = 0;
  lines.forEach((ln, li) => {
    const L = document.createElement('div');
    L.className = 'line ' + cls; L.style.top = P(top);
    stage.appendChild(L);
    const fs = parseFloat(getComputedStyle(L).fontSize);
    L.style.top = P(top + li * fs * lineH);
    ln.forEach((wd, wi) => {
      const w = mk('w' + (wd.c ? ' ' + wd.c : ''), (wi ? '&nbsp;' : '') + wd.t, { position: 'relative' }, L);
      tw(w, 'y', t0 + n * gap, 0.9, fs * 1.2, 0, 'out');
      w._fs = fs; n++;
      out.push(w);
    });
  });
  return out;
}
const W = (t, c) => ({ t, c });
// send a group of elements out (rise + fade) with a small stagger
const LEAD = 0.5;   // the outgoing scene starts leaving this long before the next one arrives
function exit(list, t0, dy = -80, gap = 0.012) {
  list.forEach((e, i) => { tw(e, 'y', t0 + i * gap, 0.42, val(e, 'y', 1e9, 0), (val(e, 'y', 1e9, 0)) + dy, 'in'); tw(e, 'o', t0 + i * gap + 0.08, 0.3, 1, 0, 'lin'); });
}
function wordsExit(ws, t0) { ws.forEach((w, i) => { tw(w, 'y', t0 + i * 0.022, 0.36, 0, -w._fs * 1.2, 'in'); }); }
// pop in with spring scale + fade
function pop(e, t0, k = 1, from = 0.6) { tw(e, 's', t0, 1, from, 1, 'spring', k); tw(e, 'o', t0, 0.18, 0, 1, 'lin'); return e; }
function rise(e, t0, dy = 70, k = 0.85) { tw(e, 'y', t0, 1, dy, 0, 'spring', k); tw(e, 'o', t0, 0.25, 0, 1, 'lin'); return e; }
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const chip = (txt, left, top, t0) => rise(mk('chip', `<i></i>${txt}`, { left: P(left), top: P(top) }), t0, 40);

/* =====================================================================
   SCENE TIMINGS (seconds). These are re-timed to the voiceover once the
   MP3 arrives: each scene starts where its sentence starts.
   ===================================================================== */
// Timed to the ElevenLabs voiceover (word timings from a forced alignment of the script).
const C = window.CUES || {
  hook: 0, hook2: 2.15, hook3: 3.25, uber: 4.75, web: 15.4, design: 24.6, courses: 32.3, print: 37.85, soft: 40.85, end: 43.85, total: 54.5,
  // phrase cues inside scenes (offsets from scene start)
  uberWalk: 5.2, uberWait: 7.2, uberPrice: 8.55,
  webBiz: 2.3, webStore: 3.4, webBook: 4.65, webPrice: 6.2,
  dLogo: 2.55, dFlyer: 3.24, dBanner: 3.92, dSocial: 4.8,
  cApps: [0.41, 1.28, 2.12, 2.99], cHands: 4.1,
  pPages: [0.1, 0.6, 1.3], pDone: 1.85,
  eWeb: 1.45, eAddr: 1.85, eHours: 5.25, eWa: 6.7,
};
const END = C.total;

/* ---------- always-on: grid drift + small logo ---------- */
const grid = stage.querySelector('#grid'); grid._t = []; ELS.push(grid);
tw(grid, 'y', 0, END, 0, -60, 'lin'); tw(grid, 'x', 0, END, 0, 30, 'lin');
const logoTop = mk('logo-top', `<img src="${A}logo-footer.svg" style="width:300px;display:block">`);
tw(logoTop, 'o', 0.1, 0.5, 0, 1, 'lin'); tw(logoTop, 'y', 0.1, 1, -20, 0, 'spring', .8);
tw(logoTop, 'o', C.end - 0.1, 0.3, 1, 0, 'lin');

/* ===================== 1. HOOK ===================== */
{
  const t = C.hook;
  const a = words([[W('Need'), W('it')], [W('done'), W('right?', 'red')]], 640, 'h-xl', t + 0.15, 0.09);
  wordsExit(a, C.hook2 - 0.42);
  const b1 = words([[W('Sorted.')]], 640, 'h-xl', C.hook2 + 0.05, 0.08);
  const b2 = words([[W('In'), W('one'), W('stop.', 'red')]], 640 + 156 * 1.06, 'h-xl', C.hook3, 0.16);
  const b = [...b1, ...b2];
  const c = chip('Tech &amp; design studio · Johannesburg', 80, 1020, C.hook3 + 0.5);
  // six little service dots that tick on under the claim
  const icons = ['M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4M14 13.12c0 2.38 0 6.38-1 8.88M17.29 21.02c.12-.6.43-2.3.5-3.02M2 12a10 10 0 0 1 18-6M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2M9 6.8a6 6 0 0 1 9 5.2v2',
    'M8 7 3 12l5 5M16 7l5 5-5 5', 'M12 19l7-7 3 3-7 7-3-3zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5zM2 2l7.59 7.59', 'M22 10 12 5 2 10l10 5 10-5zM6 12v5c3 2 9 2 12 0v-5',
    'M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z', 'M3 4h18v12H3zM8 20h8M12 16v4'];
  const dots = icons.map((d, i) => {
    const e = mk('', `<div style="width:96px;height:96px;border-radius:28px;background:#0b2537;border:1.5px solid #1f415a;display:grid;place-items:center"><svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="${i < 3 ? '#ff4545' : '#9fb3c1'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg></div>`, { left: P(80 + i * 116), top: P(1130) });
    pop(e, C.hook3 + 0.65 + i * 0.07, 1.1, 0.4);
    return e;
  });
  wordsExit(b, C.uber - LEAD);
  exit([c, ...dots], C.uber - LEAD, -70, 0.012);
}

/* ===================== 2. UBER & BOLT ===================== */
{
  const t = C.uber;
  const c = chip('For Uber &amp; Bolt drivers', 80, 300, t + 0.05);
  const h = words([[W('Fingerprint')], [W('capture.', 'red')]], 390, 'h-l', t + 0.12, 0.08);
  const logos = mk('', `<div class="row" style="gap:30px"><img src="${A}partners/uber.svg" style="height:40px;filter:brightness(0) invert(1)"><i style="width:2px;height:44px;background:#1f415a"></i><img src="${A}partners/bolt.svg" style="height:52px"></div>`, { left: P(80), top: P(660) });
  rise(logos, t + 0.55, 40);
  // the photo: rounded card, wipes up out of a mask while settling from a zoom
  const ph = mk('photo', `<img src="${A}photos/fingerprint-uber-bolt-1050.jpg">`, { left: P(80), top: P(760), width: P(540), height: P(790) });
  const img = ph.querySelector('img'); img._t = []; ELS.push(img);
  tw(ph, 'clip', t + 0.45, 1.25, [100, 0, 0, 0, 40], [0, 0, 0, 0, 40], 'out');
  tw(img, 's', t + 0.45, 1.6, 1.22, 1.04, 'out'); tw(img, 's', t + 2.05, 6.5, 1.04, 1.0, 'lin');
  // a red scan line passing over the scanner
  const scan = mk('', '', { left: P(110), top: P(760), width: P(480), height: P(4), borderRadius: '4px', background: '#ff4545' });
  tw(scan, 'o', t + 1.4, 0.2, 0, 1, 'lin'); tw(scan, 'y', t + 1.4, 1.5, 120, 700, 'io'); tw(scan, 'o', t + 2.75, 0.2, 1, 0, 'lin');
  // checklist card
  const rows = ['Bring your ID', 'Walk in · no appointment', 'Done while you wait'];
  const list = mk('card', `<div style="padding:30px 32px;display:grid;gap:22px">${rows.map((r, i) => `<div class="row"><div class="tick" data-i="${i}" style="background:transparent;border:2.5px solid #2b4d66">${TICK}</div><span style="font-size:31px;font-weight:500">${r}</span></div>`).join('')}</div>`, { left: P(560), top: P(880), width: P(440) });
  tw(list, 'x', t + 1.1, 1, 120, 0, 'spring', .8); tw(list, 'o', t + 1.1, 0.25, 0, 1, 'lin');
  const ticks = [...list.querySelectorAll('.tick')].map((tk, i) => {
    const svg = tk.querySelector('svg'); svg.classList.add('a'); svg.style.position = 'static';
    const at = t + [C.uberWalk - 0.6, C.uberWalk, C.uberWait][i];
    svg._t = []; ELS.push(svg); tw(svg, 's', at, 1, 0, 1, 'spring', 1.2);
    tk._fn = null;
    const bg = mk('', '', { left: 0, top: 0, width: 0, height: 0 }); bg._fn = (tt) => {
      const on = tt >= at; tk.style.background = on ? '#22c55e' : 'transparent'; tk.style.borderColor = on ? '#22c55e' : '#2b4d66';
    };
    return tk;
  });
  // price
  const price = mk('card white', `<div style="padding:30px 36px 34px"><div style="font-size:26px;color:#4d5f6c;font-weight:500">Per capture</div><div class="mono" style="font-size:136px;font-weight:500;letter-spacing:-.05em;line-height:1;color:#ff4545;margin-top:6px">R350</div></div>`, { left: P(600), top: P(1260), width: P(400) });
  pop(price, t + C.uberPrice, .9, 0.5); tw(price, 'r', t + C.uberPrice, 1, -8, 0, 'spring', .9);
  exit([c, logos, list, price, ph], C.web - LEAD); wordsExit(h, C.web - LEAD);
}

/* ===================== 3. WEB & APP ===================== */
{
  const t = C.web;
  const c = chip('Web &amp; app development', 80, 300, t + 0.05);
  const h = words([[W('Websites')], [W('&amp;'), W('apps.', 'red')]], 390, 'h-l', t + 0.12, 0.08);
  // chips that land with the voiceover
  const tags = ['Business websites', 'Online stores', 'Booking systems'].map((s, i) => {
    const e = mk('pill', `<span style="width:12px;height:12px;border-radius:50%;background:#22c55e"></span>${s}`, { left: P(80), top: P(680 + i * 92), background: 'rgba(255,255,255,.06)', border: '1.5px solid #1f415a', height: '72px', fontSize: '30px' });
    rise(e, t + [C.webBiz, C.webStore, C.webBook][i], 40); return e;
  });
  // booking card (behind, left)
  const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  const book = mk('card', `<div style="padding:26px 28px">
      <div class="row" style="justify-content:space-between"><b style="font-size:28px;font-weight:500">Book a slot</b><span class="small">Nov</span></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:20px">${days.map((d, i) => `<div style="height:62px;border-radius:14px;display:grid;place-items:center;font-size:24px;${i === 3 ? 'background:#ff4545;color:#fff' : 'background:#0f2c40;color:#9fb3c1'}">${d}</div>`).join('')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px">${['09:00', '11:30', '14:00'].map((s, i) => `<div style="height:56px;border-radius:12px;display:grid;place-items:center;font-size:23px;${i === 1 ? 'background:#fff;color:#001523;font-weight:500' : 'background:#0f2c40;color:#9fb3c1'}">${s}</div>`).join('')}</div></div>`,
    { left: P(80), top: P(990), width: P(440) });
  tw(book, 'y', t + C.webBook - 0.2, 1, 80, 0, 'spring', .8); tw(book, 'o', t + C.webBook - 0.2, 0.25, 0, 1, 'lin');
  const toast = mk('pill', `<span class="tick" style="width:40px;height:40px">${TICK}</span>Booking confirmed`, { left: P(100), top: P(1300), background: '#fff', color: '#001523', fontSize: '28px', height: '74px', boxShadow: '0 30px 60px -30px rgba(0,0,0,.7)' });
  pop(toast, t + C.webBook + 0.55, 1, 0.7);
  // the phone, building a site
  const phone = mk('', '', { left: P(560), top: P(640), width: P(420), height: P(860), borderRadius: '64px', background: '#06192a', border: '12px solid #163650', boxShadow: '0 60px 120px -50px rgba(0,0,0,.8)', overflow: 'hidden' });
  rise(phone, t + 0.35, 140, .75);
  const scr = (html, css) => mk('', html, Object.assign({ position: 'absolute' }, css), phone);
  const screen = scr('', { left: '0', top: '0', width: '396px', height: '836px', background: '#fff' });
  tw(screen, 'o', t + 0.6, 0.3, 0, 1, 'lin');
  const nav = scr(`<div class="row" style="justify-content:space-between;padding:0 26px;height:84px"><div class="row" style="gap:10px"><i style="width:30px;height:30px;border-radius:9px;background:#ff4545"></i><i style="width:96px;height:14px;border-radius:8px;background:#001523"></i></div><div class="row" style="gap:8px"><i style="width:34px;height:4px;background:#001523;border-radius:2px;box-shadow:0 10px 0 #001523,0 -10px 0 #001523"></i></div></div>`, { left: '0', top: '20px', width: '396px' });
  rise(nav, t + 0.8, -30);
  const hero = scr(`<img src="${A}photos/coding-web-dev-800.jpg" style="width:100%;height:100%;object-fit:cover;display:block">`, { left: '20px', top: '116px', width: '356px', height: '230px', borderRadius: '26px', overflow: 'hidden' });
  tw(hero, 'clip', t + 1.0, 1, [0, 100, 0, 0, 26], [0, 0, 0, 0, 26], 'out');
  const bars = [[300, 26, '#001523'], [230, 26, '#001523'], [270, 14, '#9fb3c1'], [200, 14, '#9fb3c1']].map(([w, hh, col], i) => {
    const b = scr('', { left: '26px', top: P(378 + [0, 38, 92, 118][i]), width: P(w), height: P(hh), borderRadius: '8px', background: col, transformOrigin: '0 50%' });
    tw(b, 'sx', t + 1.3 + i * 0.08, 0.7, 0, 1, 'out'); return b;
  });
  const btn = scr(`<div style="height:64px;padding:0 30px;border-radius:99px;background:#ff4545;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:500">Shop now</div>`, { left: '26px', top: '560px' });
  pop(btn, t + 1.75, 1.1, 0.5);
  const prods = [0, 1, 2, 3].map((i) => {
    const p = scr(`<div style="height:100%;border-radius:20px;background:#eef2f5;display:grid;align-content:end;padding:14px"><i style="display:block;width:70%;height:12px;border-radius:6px;background:#001523"></i><i style="display:block;width:40%;height:12px;border-radius:6px;background:#ff4545;margin-top:8px"></i></div>`, { left: P(26 + (i % 2) * 176), top: P(650 + Math.floor(i / 2) * 0), width: '168px', height: '160px' });
    if (i > 1) p.style.display = 'none';
    pop(p, t + 2.05 + i * 0.1, 1, 0.7); return p;
  });
  const live = mk('pill', `<span style="width:14px;height:14px;border-radius:50%;background:#22c55e"></span>Live`, { left: P(820), top: P(600), background: '#fff', color: '#001523', height: '68px', fontSize: '28px', boxShadow: '0 30px 60px -30px rgba(0,0,0,.7)' });
  pop(live, t + 2.7, 1.1, 0.4);
  // price card replaces the chips once the price is spoken
  const price = mk('card white', `<div style="padding:26px 34px 30px"><div style="font-size:26px;color:#4d5f6c;font-weight:500">Websites from</div><div class="mono" style="font-size:112px;font-weight:500;letter-spacing:-.05em;line-height:1;color:#ff4545;margin-top:6px">R3,500</div></div>`, { left: P(560), top: P(1300), width: P(440) });
  pop(price, t + C.webPrice, .9, 0.5); tw(price, 'r', t + C.webPrice, 1, 6, 0, 'spring', .9);
