<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Web Graphs — A4 flyer · Adobe courses</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* A4 = 210 × 297 mm, same white style and 13 mm safe area as flyer.html. */
:root { --bleed: 0mm; --safe: 13mm; --navy:#001523; --navy2:#0b2537; --line:#1f415a; --red:#ff4545; --ink:#001523; --mute:#55646e; --mist:#f2f5f7; --green:#25d366; }
@page { size: 210mm 297mm; margin: 0; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width: calc(210mm + 2 * var(--bleed)); height: calc(297mm + 2 * var(--bleed)); }
body { font-family:'Google Sans', system-ui, sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; color:var(--ink); }
.page { position:relative; width:100%; height:100%; overflow:hidden; background:#fff; }
.trim { position:absolute; left:var(--bleed); top:var(--bleed); width:210mm; height:297mm; }
.safe { position:absolute; inset:var(--safe); display:flex; flex-direction:column; }
.safe > * { flex-shrink:0; }
.row { display:flex; align-items:center; }
.ic { display:block; flex:none; }
.ic svg { width:100%; height:100%; display:block; }
.tick { width:5.6mm; height:5.6mm; border-radius:50%; background:#22c55e; display:grid; place-items:center; flex:none; }
.tick svg { width:3.4mm; height:3.4mm; }
.mono { font-variant-numeric:tabular-nums; }
.logo { height:13mm; display:block; }
.open { gap:2mm; height:8.6mm; padding:0 3.6mm; border-radius:99px; font-size:3.4mm; font-weight:500; background:var(--mist); }
.open i { width:2.2mm; height:2.2mm; border-radius:50%; background:#22c55e; }
.chip { display:inline-flex; align-items:center; gap:2mm; height:8mm; padding:0 3.4mm; border-radius:99px; font-size:3.3mm; font-weight:500; background:rgba(255,255,255,.09); border:.3mm solid rgba(255,255,255,.18); }
.chip i { width:2mm; height:2mm; border-radius:50%; background:var(--red); }
.h1 { font-weight:600; letter-spacing:-.045em; line-height:.98; }
.h1 em { font-style:normal; color:var(--red); }
.price { font-weight:600; letter-spacing:-.05em; line-height:.9; color:var(--red); }
.photo { border-radius:5mm; overflow:hidden; }
.photo img { display:block; width:100%; height:100%; }
.h2 { font-size:5.8mm; font-weight:600; letter-spacing:-.025em; }
.h2 span { color:var(--red); }
.course { background:var(--mist); border-radius:4.4mm; padding:3.6mm 3.6mm 3.8mm; }
.course .app { width:10.5mm; height:10.5mm; display:block; flex:none; }
.course b { font-size:4.4mm; font-weight:600; letter-spacing:-.02em; line-height:1.1; display:block; }
.course p { font-size:2.85mm; line-height:1.3; color:var(--mute); margin-top:.6mm; }
.tags { display:flex; flex-wrap:wrap; gap:1.2mm; margin-top:2.8mm; }
.tags span { font-size:2.55mm; font-weight:500; line-height:1; padding:1.25mm 2.1mm; border-radius:99px; background:#fff; color:var(--ink); }
.bundle { border:.35mm solid #dfe5e9; border-radius:4mm; padding:2.9mm 3mm 2.9mm; display:flex; flex-direction:column; }
.bundle .apps { display:flex; gap:.8mm; }
.bundle .apps img { width:5.4mm; height:5.4mm; display:block; }
.bundle .names { font-size:2.5mm; font-weight:600; line-height:1; color:var(--red); margin-top:1.8mm; height:2.5mm; }
.bundle .amt { font-size:5.6mm; font-weight:600; letter-spacing:-.035em; line-height:1; margin-top:auto; padding-top:2mm; }
.bundle .len { font-size:2.75mm; font-weight:500; margin-top:1mm; color:var(--ink); }
.bundle.all { background:var(--navy); border-color:var(--navy); color:#fff; }
.bundle.all .names { color:#fff; }
.bundle.all .amt { color:var(--red); }
.bundle.all .len { color:#fff; }
</style></head>
<body>
<div class="page"><div class="trim" id="trim"></div></div>
<script>
const q = new URLSearchParams(location.search);
const BLEED = Number(q.get('bleed') || 0);
document.documentElement.style.setProperty('--bleed', BLEED + 'mm');
if (BLEED) { const st = document.createElement('style'); st.textContent = `@page { size: ${210 + 2 * BLEED}mm ${297 + 2 * BLEED}mm; margin: 0; }`; document.head.appendChild(st); }
const A = '../../assets/';
const I = (d, col, sw = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const WA = (col) => `<svg viewBox="0 0 24 24" fill="${col}"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.41-.08-.13-.27-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.89 9.88M20.46 3.49A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.16-3.48-8.41Z"/></svg>`;
const ICONS = {
  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
};
const APP = (k) => `${A}icons/${k.toLowerCase()}.svg`;
const NAMES = { Ps: 'Photoshop', Ai: 'Illustrator', Lr: 'Lightroom', Pr: 'Premiere Pro' };

// Everything below is copied from courses.html and the bundle calculator in js/site.js.
const COURSES = [
  ['Ps', 'Adobe Photoshop', 'Master photo editing, retouching and mock-up creation.', ['Background removal', 'Photo compositing', 'Retouching', 'Colour correction', 'Product mock-ups']],
  ['Ai', 'Adobe Illustrator', 'Master vector graphics, logo and ad design.', ['Logo design', 'Symbol &amp; icon design', 'Pen tool', 'Brand guidelines', 'Social media ads', 'Flyer designs']],
  ['Lr', 'Adobe Lightroom', 'Organise, edit and grade your photography like a pro.', ['Photo import &amp; organisation', 'Exposure &amp; colour correction', 'Portrait editing', 'Professional colour grading']],
  ['Pr', 'Adobe Premiere Pro', 'Edit professional-quality video from raw footage to final export.', ['Cutting &amp; trimming', 'Transitions', 'Text &amp; titles', 'Basic effects', 'Audio editing', 'Video export']],
];
const BUNDLES = [
  [['Ai'], 'R2,000', '1 month'],
  [['Ai', 'Lr'], 'R2,500', '1–2 months'],
  [['Ps', 'Ai'], 'R4,500', '2 months'],
  [['Ps', 'Ai', 'Lr'], 'R4,500', '3 months'],
  [['Ai', 'Pr'], 'R5,000', '2 months'],
  [['Ps', 'Ai', 'Lr', 'Pr'], 'R7,500', '4 months', 'All four apps'],
];
const WHY = ['Hands-on projects', 'Beginner friendly', 'Flexible learning', 'Career-ready skills'];

const PW = 86, PH = +(PW * 2084 / 3125).toFixed(1);   // photo keeps its own ratio, never cropped
document.getElementById('trim').innerHTML = `<div class="safe">
  <div class="row" style="justify-content:space-between">
    <img class="logo" src="${A}logo-full.svg">
    <span class="row open"><i></i>Open every day · 8:00–19:00</span>
  </div>

  <div style="margin-top:6mm;border-radius:7mm;background:var(--navy);color:#fff;padding:5.2mm 5.2mm 5.2mm 7mm;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr ${PW}mm;gap:6mm;align-items:center">
    <div style="position:absolute;width:110mm;height:110mm;border-radius:50%;background:var(--red);right:-58mm;bottom:-74mm"></div>
    <div style="position:relative">
      <div class="h1" style="font-size:10.4mm;margin-top:0">Graphic design<br>&amp; video <em>courses.</em></div>
      <div class="row" style="gap:1.8mm;margin-top:4.2mm">${['Ps', 'Ai', 'Lr', 'Pr'].map((k) => `<img src="${APP(k)}" style="width:7.6mm;height:7.6mm;display:block">`).join('')}</div>
      <div style="font-size:3.5mm;color:#9fb3c1;margin-top:4.4mm">Courses from</div>
      <div class="row" style="align-items:flex-end;gap:3mm;margin-top:1mm"><div class="price mono" style="font-size:16mm">R2,000</div><div style="font-size:3.6mm;color:#9fb3c1;margin-bottom:1.2mm;line-height:1.2">1 to 4<br>months</div></div>
    </div>
    <div class="photo" style="position:relative;width:${PW}mm;height:${PH}mm"><img src="img/courses-class.jpg"></div>
  </div>

  <div class="row" style="justify-content:space-between;margin-top:4.2mm;font-size:3.55mm;font-weight:500">
    ${WHY.map((s) => `<div class="row" style="gap:2mm"><span class="tick">${TICK}</span>${s}</div>`).join('')}
  </div>

  <div class="row" style="justify-content:space-between;align-items:baseline;margin-top:5mm"><b class="h2">What you'll <span>learn</span></b><span style="font-size:3.1mm;color:var(--mute)">Practical, project-based training</span></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin-top:3.2mm">
    ${COURSES.map(([k, n, d, tags]) => `<div class="course">
      <div class="row" style="gap:3mm;align-items:center"><img class="app" src="${APP(k)}"><div><b>${n}</b><p>${d}</p></div></div>
      <div class="tags">${tags.map((t) => `<span>${t}</span>`).join('')}</div>
    </div>`).join('')}
  </div>

  <div class="row" style="justify-content:space-between;align-items:baseline;margin-top:5mm"><b class="h2">Pricing &amp; <span>bundles</span></b><span style="font-size:3.1mm;color:var(--mute)">Hands-on, at the studio in Langlaagte North</span></div>
  <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:2.4mm;margin-top:3.2mm">
    ${BUNDLES.map(([combo, amt, len, tag]) => `<div class="bundle${tag ? ' all' : ''}">
      <div class="apps">${combo.map((k) => `<img src="${APP(k)}">`).join('')}</div>
      <div class="names">${tag || ''}</div>
      <div class="amt mono">${amt}</div><div class="len">${len}</div>
    </div>`).join('')}
  </div>

  <div style="margin-top:auto;border-radius:5.5mm;background:var(--navy);color:#fff;padding:4.4mm 4.6mm 4.4mm 5.6mm;display:grid;grid-template-columns:1fr auto;gap:5mm;align-items:center">
    <div>
      <div class="row" style="gap:3mm"><span style="width:11mm;height:11mm;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none"><span style="width:6.4mm;height:6.4mm;display:block">${WA('#fff')}</span></span><div><div style="font-size:3.1mm;color:#9fb3c1">Ready to enrol? Ask about the next intake</div><b class="mono" style="font-size:8.2mm;font-weight:600;letter-spacing:-.02em;line-height:1">+27 78 734 7867</b></div></div>
      <div style="display:grid;grid-template-columns:auto auto;gap:1.8mm 5.5mm;margin-top:3.4mm;font-size:3.25mm;color:#dfe7ec">
        ${[['globe', '<b style="font-weight:600">webgraphs.co.za</b>'], ['mail', 'webgraphstechnologies@gmail.com'], ['pin', '9 Jill Street, Langlaagte North, Johannesburg'], ['clock', 'Open every day · 8:00–19:00']].map(([ic, s]) => `<div class="row" style="gap:1.8mm"><span class="ic" style="width:4.3mm;height:4.3mm">${I(ICONS[ic], '#ff6b6b', 2)}</span>${s}</div>`).join('')}
      </div>
    </div>
    <div style="text-align:center"><img src="${A}whatsapp-qr.svg" style="width:25mm;height:25mm;display:block;border-radius:2mm"><div style="font-size:2.8mm;font-weight:600;margin-top:1.3mm">Scan to WhatsApp</div></div>
  </div>
</div>`;
window.__ready = Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.decode().catch(() => {}))]);
</script>
</body></html>
